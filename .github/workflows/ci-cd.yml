name: CI Security and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-security:
    name: Quality and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Tests and coverage
        run: python -m pytest --cov=app --cov-report=term --cov-report=xml

      - name: Bandit SAST
        run: bandit -c pyproject.toml -r app

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=MiniRisk-SDD
            -Dsonar.python.version=3.13
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=app/templates/**,app/static/**

  deploy:
    name: Deploy to AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t minirisk:${GITHUB_SHA} .

      - name: Export image and deployment environment
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          docker save minirisk:${GITHUB_SHA} | gzip > minirisk-image.tar.gz
          printf 'APP_SECRET_KEY=%s\n' "$APP_SECRET_KEY" > deploy.env
          chmod 600 deploy.env

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2

          if [[ -z "$EC2_HOST" ]]; then
            echo "ERROR: EC2_HOST is empty."
            exit 1
          fi

          if [[ "$EC2_HOST" == http* ]] || [[ "$EC2_HOST" == *"@"* ]] || [[ "$EC2_HOST" == *":"* ]]; then
            echo "ERROR: EC2_HOST must contain only the public IPv4 address or public DNS."
            exit 1
          fi

          echo "Testing TCP port 22 on EC2..."
          if ! nc -vz -w 10 "$EC2_HOST" 22; then
            echo "ERROR: GitHub runner cannot reach EC2 on TCP port 22."
            exit 1
          fi

          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts
          echo "SSH configuration completed successfully."

      - name: Copy artifact to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/id_ec2 minirisk-image.tar.gz deploy.env ubuntu@"$EC2_HOST":/tmp/

      - name: Deploy container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_ec2 ubuntu@"$EC2_HOST" "GITHUB_SHA=${GITHUB_SHA} bash -s" <<'REMOTE'
            set -euo pipefail
            sudo mkdir -p /opt/minirisk
            sudo mv /tmp/deploy.env /opt/minirisk/.env
            sudo chmod 600 /opt/minirisk/.env
            sudo docker load -i /tmp/minirisk-image.tar.gz
            sudo docker rm -f minirisk 2>/dev/null || true
            sudo docker run -d \
              --name minirisk \
              --restart unless-stopped \
              --env-file /opt/minirisk/.env \
              -p 80:8000 \
              "minirisk:${GITHUB_SHA}"
            rm -f /tmp/minirisk-image.tar.gz
            sudo docker image prune -f
          REMOTE

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          echo "Waiting for MiniRisk to become available on port 80..."
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 5 \
              "http://${EC2_HOST}/healthz"; then
              echo
              echo "MiniRisk is healthy."
              exit 0
            fi

            echo "Attempt ${attempt}/12 failed; waiting 5 seconds..."
            sleep 5
          done

          echo "ERROR: MiniRisk did not become reachable."
          echo "Collecting diagnostics from EC2..."
          ssh -i ~/.ssh/id_ec2 ubuntu@"$EC2_HOST" \
            'sudo docker ps -a --filter name=minirisk && echo "--- container logs ---" && sudo docker logs --tail 100 minirisk || true'
          exit 1
