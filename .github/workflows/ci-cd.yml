name: CI Security and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-security:
    name: Quality and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Tests and coverage
        run: pytest --cov=app --cov-report=term --cov-report=xml

      - name: Bandit SAST
        run: bandit -c pyproject.toml -r app

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=MiniRisk-SDD
            -Dsonar.python.version=3.13
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=app/templates/**,app/static/**

  deploy:
    name: Deploy to AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t minirisk:${GITHUB_SHA} .

      - name: Export image and deployment environment
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          docker save minirisk:${GITHUB_SHA} | gzip > minirisk-image.tar.gz
          printf 'APP_SECRET_KEY=%s\n' "$APP_SECRET_KEY" > deploy.env
          chmod 600 deploy.env

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy artifact to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/id_ec2 minirisk-image.tar.gz deploy.env ubuntu@"$EC2_HOST":/tmp/

      - name: Deploy container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_ec2 ubuntu@"$EC2_HOST" "GITHUB_SHA=${GITHUB_SHA} bash -s" <<'REMOTE'
            set -euo pipefail
            sudo mkdir -p /opt/minirisk
            sudo mv /tmp/deploy.env /opt/minirisk/.env
            sudo chmod 600 /opt/minirisk/.env
            sudo docker load -i /tmp/minirisk-image.tar.gz
            sudo docker rm -f minirisk 2>/dev/null || true
            sudo docker run -d \
              --name minirisk \
              --restart unless-stopped \
              --env-file /opt/minirisk/.env \
              -p 80:8000 \
              "minirisk:${GITHUB_SHA}"
            rm -f /tmp/minirisk-image.tar.gz
            sudo docker image prune -f
          REMOTE

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            "http://${EC2_HOST}/healthz"
